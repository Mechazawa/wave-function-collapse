[package]
name = "wfc-wasm"
version = "2.0.0"
description = "Wave function collapse solver for the browser"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Tile definitions in, grid state out. The solver needs nothing the CLI uses.
wave-function-collapse.workspace = true

console_error_panic_hook = "0.1"
js-sys = "0.3"
serde.workspace = true
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]
