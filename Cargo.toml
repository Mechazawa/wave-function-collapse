[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "CC0"
repository = "https://github.com/Mechazawa/wave-function-collapse"

[workspace.dependencies]
wave-function-collapse = { version = "2.0.0", path = "crates/wave-function-collapse" }

enum-map = "2.5"
fxhash = "0.2"
image = { version = "0.25.8", default-features = false }
log = "0.4"
rand = { version = "0.9.2", default-features = false }
rand_xorshift = "0.4.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

[profile.release]
lto = "fat"

[profile.profiling]
inherits = "release"
debug = true
