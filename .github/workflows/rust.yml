name: CI

on:
  pull_request:
  push:
    branches:
      - master

env:
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test Rust ${{ matrix.rust }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta, nightly]
    steps:
      - uses: actions/checkout@v4
      - uses: hecrj/setup-rust-action@v2
        with:
          rust-version: ${{ matrix.rust }}
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-image-dev
      - run: cargo test --verbose -p wave-function-collapse
      - run: cargo test --verbose -p wave-function-collapse --features threaded
      - run: cargo test --verbose -p wfc-cli
      - run: cargo test --verbose -p wfc-cli --no-default-features

  clippy:
    name: Lint with clippy
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v4
      - uses: hecrj/setup-rust-action@v2
        with:
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-image-dev
      - run: cargo clippy -p wave-function-collapse --all-targets --verbose
      - run: cargo clippy -p wave-function-collapse --all-targets --verbose --features threaded
      - run: cargo clippy -p wfc-cli --all-targets --verbose
      - run: cargo clippy -p wfc-cli --all-targets --verbose --no-default-features

  wasm:
    name: Build the wasm solver
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v4
      - uses: hecrj/setup-rust-action@v2
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - run: cargo clippy -p wfc-wasm --target wasm32-unknown-unknown --verbose
      - name: The solver carries no image or OS randomness dependency
        run: |
          tree=$(cargo tree -e normal -p wfc-wasm --target wasm32-unknown-unknown)
          echo "$tree"
          ! echo "$tree" | grep -qiE 'getrandom|^\S*image|sdl2|clap'

  deps:
    name: The library carries nothing the CLI needs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hecrj/setup-rust-action@v2
      - run: |
          tree=$(cargo tree -e normal -p wave-function-collapse)
          echo "$tree"
          ! echo "$tree" | grep -qiE 'sdl2|clap|indicatif|simplelog|getrandom|image|serde'

  rustfmt:
    name: Verify code formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hecrj/setup-rust-action@v2
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
