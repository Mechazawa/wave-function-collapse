name: CI

on:
  pull_request:
  push:
    branches:
      - master

env:
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test Rust ${{ matrix.rust }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rust: stable,           os: ubuntu-latest }
          - { rust: beta,             os: ubuntu-latest }
          - { rust: nightly,          os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: hecrj/setup-rust-action@v2
        with:
          rust-version: ${{ matrix.rust }}
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-image-dev
      - run: cargo test --verbose -p wave-function-collapse
      - run: cargo test --verbose -p wave-function-collapse --all-features
      - run: cargo test --verbose -p wave-function-collapse --no-default-features
      - run: cargo test --verbose -p wave-function-collapse --no-default-features --features image

  clippy:
    name: Lint with clippy
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v4
      - uses: hecrj/setup-rust-action@v2
        with:
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-image-dev
      - run: cargo clippy -p wave-function-collapse --all-targets --verbose
      - run: cargo clippy -p wave-function-collapse --all-targets --verbose --no-default-features
      - run: cargo clippy -p wave-function-collapse --all-targets --verbose --no-default-features --features image
      - run: cargo clippy -p wave-function-collapse --all-targets --verbose --no-default-features --features cli
      - run: cargo clippy -p wave-function-collapse --all-targets --verbose --all-features

  deps:
    name: Library carries no CLI dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hecrj/setup-rust-action@v2
      - name: No sdl2, CLI or OS randomness in a library-only build
        run: |
          tree=$(cargo tree -e normal --no-default-features --features image)
          echo "$tree"
          ! echo "$tree" | grep -qiE 'sdl2|structopt|indicatif|simplelog|getrandom'

  rustfmt:
    name: Verify code formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hecrj/setup-rust-action@v2
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
